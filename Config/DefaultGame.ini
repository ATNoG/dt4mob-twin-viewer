[/Script/DT4MOB.UIThemeSettings]
DarkTheme=/Game/Blueprints/UI/DA_ThemeDark.DA_ThemeDark
LightTheme=/Game/Blueprints/UI/DA_ThemeLight.DA_ThemeLight

; Entity meshes under /Game/Models are only ever referenced by hardcoded string path at
; runtime (UDT4MOBEntityFactory::Register's MeshPath, resolved via LoadObject), so the cooker
; can't discover them through normal reference-following and silently drops them from packaged
; builds. Force the whole tree to always be cooked regardless of static references.
; Same issue for DA_DittoSecrets (/Game/Data) — UDittoService::Initialize loads it via a
; hardcoded LoadObject path with nothing else referencing it, so it must be forced too.
; glTFRuntime's default materials (M_glTFRuntimeBase, M_glTFRuntime_SG_Base, etc.) are only
; ever loaded by the plugin itself via a hardcoded LoadObject("/glTFRuntime/M_...") path
; (see glTFRuntimeParser.cpp), with nothing in project content statically referencing them.
; Runtime-loaded GLBs (e.g. UFireBehaviorComponent's cone/simulation models) rely on these to
; build their materials — without this, the cooker drops them from packaged builds and
; glTFRuntime silently falls back to the engine default grey material.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Models")
+DirectoriesToAlwaysCook=(Path="/Game/Data")
+DirectoriesToAlwaysCook=(Path="/glTFRuntime")
+MapsToCook=(FilePath="/Game/Scenes/Login/Login")
+MapsToCook=(FilePath="/Game/Scenes/WorldMap/Scene")

[/Script/DT4MOB.MeshVisualSettings]
GhostMaterial=/Game/Materials/TestTransparency.TestTransparency
