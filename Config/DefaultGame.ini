; Entity meshes under /Game/Models are only ever referenced by hardcoded string path at
; runtime (UDT4MOBEntityFactory::Register's MeshPath, resolved via LoadObject), so the cooker
; can't discover them through normal reference-following and silently drops them from packaged
; builds. Force the whole tree to always be cooked regardless of static references.
; Same issue for DA_DittoSecrets (/Game/Data) — UDittoService::Initialize loads it via a
; hardcoded LoadObject path with nothing else referencing it, so it must be forced too.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Models")
+DirectoriesToAlwaysCook=(Path="/Game/Data")

